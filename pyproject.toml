[project]
name = "swaraaha"
version = "0.1.0"
description = "Audio classification, localization, and transcription for dysfluency detection"
readme = "README.md"
authors = [
    { name = "Srinivas Hegde M", email = "hegdesrinivasm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "audioread>=3.0.0",
    "fastapi>=0.100.0",
    "kaggle>=1.5.16",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0",
    "numba>=0.57.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.0.0",
    "pyside6>=6.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
    "typst>=0.6",
    "uvicorn[standard]>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false
